services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_DATABASE: sxf_checklist
      MYSQL_USER: buko_admin
      MYSQL_PASSWORD: buko_password
    ports:
      # Exposes container's internal 3306 to your computer's 3307
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Automatically runs your SQL script on startup
      - ./sxf_checklist.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Adapted to use the root password from this block
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password_here",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - FLASK_ENV=development
      # Connects to 'db' using the buko credentials on port 3306
      - DATABASE_URL=mysql+pymysql://buko_admin:buko_password@db:3306/sxf_checklist
    command: flask --app app.app run --host=0.0.0.0 --debug
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
